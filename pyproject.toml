[project]
name = "tg-get-claude-token"
version = "2.0.0"
description = "Secure Telegram forwarder for Claude/OpenAI auth, billing, and incidents"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = [
    "admin_state",
    "gmail_monitor",
    "secure_files",
    "settings",
    "state_store",
    "status_monitor",
    "telegram_admin",
    "telegram_bot",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["venv", "tests", ".git"]
skips = ["B101"]  # assert_used

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
