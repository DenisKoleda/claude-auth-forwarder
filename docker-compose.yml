services:
  claude-auth-bot:
    build: .
    container_name: claude-auth-forwarder
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"  # OAuth only through localhost/SSH tunnel
    volumes:
      # Mount credentials (required)
      - ./credentials.json:/app/credentials.json:ro
      # Mount data directory for token persistence
      - ./data:/app/data
    environment:
      - TELEGRAM_BOT_TOKEN_FILE=/run/secrets/telegram_bot_token
      - TELEGRAM_PROXY_URL_FILE=/run/secrets/telegram_proxy_url
      - TZ=Europe/Saratov
    secrets:
      - telegram_bot_token
      - telegram_proxy_url
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  telegram_proxy_url:
    file: ./secrets/telegram_proxy_url
